name: nyc_taxi_data

profile: default

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"


data_tests:
  +severity: warn  # Sets the default to warn for EVERY test in the project


models:
  nyc_taxi_data:
    +static_analysis: strict
    # Materialize staging models as views, and marts as tables
    staging:
      +materialized: view
